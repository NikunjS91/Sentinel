name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  orchestrator:
    name: orchestrator (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build and test
        working-directory: orchestrator
        run: mvn -B -Dapi.version=1.44 verify

  agents:
    name: agents (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        working-directory: agents
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: agents
        run: ruff check .
      - name: Type check
        working-directory: agents
        run: mypy .
      - name: Test
        working-directory: agents
        run: pytest
        # TC-1.8.3 (Ollama integration) skips automatically when Ollama is unreachable.

  demo-app:
    name: demo-app (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build and test
        working-directory: demo-app
        run: mvn -B verify

  ui:
    name: ui (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        working-directory: ui
        run: npm ci
      - name: Type check + build
        working-directory: ui
        run: npm run build
