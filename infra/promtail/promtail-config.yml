server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
    pipeline_stages:
      # Parse demo-app's structured JSON logs (from logstash-logback-encoder).
      # Promotes level + service to indexed Loki labels so Day-14's LogQL queries
      # like {service="demo-app", level="ERROR"} work without regex.
      - match:
          selector: '{service="demo-app"}'
          stages:
            - json:
                expressions:
                  level: level
                  msg: message
                  service: service
                  sku: sku
                  reason: reason
            - labels:
                level:
                service:
